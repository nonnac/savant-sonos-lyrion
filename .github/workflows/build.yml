name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lms_tag:
        description: "Lyrion base image tag (e.g. stable, 9.1.2)"
        default: stable
  schedule:
    - cron: "17 9 * * 1"   # weekly: rebuild on the latest Lyrion stable

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/savant-sonos-lyrion" >> "$GITHUB_OUTPUT"
          echo "lms_tag=${{ github.event.inputs.lms_tag || 'stable' }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build first without pushing; a failed patch anchor stops here and the
      # published :latest stays on the last good build.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: LMS_TAG=${{ steps.meta.outputs.lms_tag }}
          load: true
          tags: savant-sonos-lyrion:test

      - name: Read Lyrion version
        id: ver
        run: |
          v=$(docker run --rm --entrypoint sh savant-sonos-lyrion:test -c 'grep -rhoE "VERSION[[:space:]]*=[[:space:]]*.[0-9]+\.[0-9]+\.[0-9]+" /lms/slimserver.pl /lms/Slim/Utils/Versions.pm 2>/dev/null | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1' || true)
          echo "lms=${v:-unknown}" >> "$GITHUB_OUTPUT"
          echo "Lyrion version: ${v:-unknown}"

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: LMS_TAG=${{ steps.meta.outputs.lms_tag }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:lms-${{ steps.ver.outputs.lms }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
